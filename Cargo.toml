[package]
name = "dayone"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[features]
default = ["production-default", "telemetry", "embeddings"]
production-default = []
telemetry = ["dep:sentry", "dep:regex"]
embeddings = ["dep:fastembed"]

[dependencies]
anyhow = "1"
aes-gcm = "0.11"
base64 = "0.23"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
flate2 = "1"
getrandom = { version = "0.4", features = ["sys_rng"] }
hostname = "0.4"
pbkdf2 = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "native-tls", "query"] }
rpassword = "7"
rsa = { version = "0.10", features = ["sha1", "pkcs1v15"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = { version = "0.11", features = ["oid"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
md-5 = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
time = { version = "0.3.47", features = ["formatting", "parsing", "local-offset"] }
tokio-util = { version = "0.7.18", features = ["io"] }
futures-util = "0.3.32"
http-body-util = "0.1.3"
http-body = "1.0.1"
sqlite-vec = "0.1.7"
fastembed = { version = "7.7.0", optional = true, default-features = false, features = ["hf-hub-native-tls", "ort-download-binaries-native-tls"] }
lopdf = { version = "0.47.0", default-features = false }
keyring-core = "1.0.0"
thiserror = "2.0.18"
dotenvy = "0.15"
comrak = { version = "0.59", default-features = false }
toml = "1.1.1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_28"] }
crossterm = "0.29"
termimad = "0.35"
ansi-to-tui = "8"
lru = "0.19.0"
unicode-width = "0.2"
sentry = { version = "0.49.2", optional = true, default-features = false, features = ["backtrace", "contexts", "panic", "anyhow", "debug-images", "ureq", "native-tls"] }
regex = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
# Keep aligned with the Apple backend; native errors are downcast in the adapter.
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[dev-dependencies]
proptest = "1"
tempfile = "3.27.0"

# Keep dev builds small: line tables are enough for readable backtraces, and
# dependency crates rarely need to be stepped through in a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
